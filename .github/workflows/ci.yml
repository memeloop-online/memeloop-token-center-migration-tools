name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify migration tools
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org/

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: true

      - name: Install dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm ci --ignore-scripts --no-audit

      - name: Verify repository policy, types, and tests
        run: npm run verify

      - name: Verify SQLite backup command
        run: |
          test -z "$(gofmt -l cmd/cpa-session-archive-backup)"
          go test ./cmd/cpa-session-archive-backup

  build-session-archive-backup:
    name: Build verified SQLite backup runtime once
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      binary_sha256: ${{ steps.seal.outputs.binary_sha256 }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.7"
          cache: true

      - name: Build, exercise, and seal static SQLite backup runtime
        id: seal
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/session-archive-backup-runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          mkdir -p "$ARTIFACT_DIRECTORY/payload"
          CGO_ENABLED=1 CC=musl-gcc go build -trimpath -buildvcs=true -tags 'osusergo netgo static_build' \
            -ldflags '-linkmode external -extldflags -static -s -w' \
            -o "$ARTIFACT_DIRECTORY/payload/cpa-session-archive-backup" ./cmd/cpa-session-archive-backup
          chmod 0555 "$ARTIFACT_DIRECTORY/payload/cpa-session-archive-backup"
          binary="$ARTIFACT_DIRECTORY/payload/cpa-session-archive-backup"
          test -f "$binary"
          test ! -L "$binary"
          test -x "$binary"
          file "$binary" | grep -- 'statically linked'
          ! readelf -l "$binary" | grep -q 'Requesting program interpreter'
          "$binary" --help | grep -- 'pages-per-step'
          binary_sha256="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          printf 'binary_sha256=%s\n' "$binary_sha256" >> "$GITHUB_OUTPUT"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C "$ARTIFACT_DIRECTORY/payload" -cf - cpa-session-archive-backup \
            | gzip -n > "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz"
          rm -rf -- "$ARTIFACT_DIRECTORY/payload"
          (
            cd "$ARTIFACT_DIRECTORY"
            sha256sum session-archive-backup-runtime.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload verified SQLite backup runtime
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: session-archive-backup-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/session-archive-backup-runtime/session-archive-backup-runtime.tar.gz
            ${{ runner.temp }}/session-archive-backup-runtime/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish immutable migration-tools release and pinned archive runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, build-session-archive-backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MTC_TEST_POSTGRES_URL: postgres://token_center:token_center@127.0.0.1:5432/memeloop_token_center_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memeloop_token_center_test
          POSTGRES_USER: token_center
          POSTGRES_PASSWORD: token_center
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U token_center -d memeloop_token_center_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    permissions:
      contents: write
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org/

      - name: Install locked build dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm ci --ignore-scripts --no-audit

      - name: Build dependency-bundled release commands
        run: npm run build

      - name: Download verified SQLite backup runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: session-archive-backup-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/session-archive-backup-runtime

      - name: Install the shared SQLite backup runtime
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/session-archive-backup-runtime
          EXPECTED_BINARY_SHA256: ${{ needs.build-session-archive-backup.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          test "$(find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 2
          test -f "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz"
          test ! -L "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz"
          test -f "$ARTIFACT_DIRECTORY/SHA256SUMS"
          test ! -L "$ARTIFACT_DIRECTORY/SHA256SUMS"
          (cd "$ARTIFACT_DIRECTORY" && sha256sum -c SHA256SUMS)
          test "$(tar -tzf "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz")" = "cpa-session-archive-backup"
          extracted="$(mktemp -d "$RUNNER_TEMP/session-archive-backup-release.XXXXXX")"
          trap 'rm -rf -- "$extracted"' EXIT
          tar -xzf "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz" -C "$extracted" --no-same-owner
          binary="$extracted/cpa-session-archive-backup"
          test -f "$binary"
          test ! -L "$binary"
          test -x "$binary"
          test "$(sha256sum "$binary" | cut -d ' ' -f 1)" = "$EXPECTED_BINARY_SHA256"
          file "$binary" | grep -- 'statically linked'
          ! readelf -l "$binary" | grep -q 'Requesting program interpreter'
          "$binary" --help | grep -- 'pages-per-step'
          mkdir -p dist/release/commands/runtime
          install -m 0555 "$binary" dist/release/commands/runtime/cpa-session-archive-backup
          packaged="dist/release/commands/runtime/cpa-session-archive-backup"
          test -f "$packaged"
          test ! -L "$packaged"
          test -x "$packaged"
          test "$(sha256sum "$packaged" | cut -d ' ' -f 1)" = "$EXPECTED_BINARY_SHA256"
          "$packaged" --help | grep -- 'pages-per-step'
          mkdir -p dist/release/commands/runtime/licenses
          install -m 0444 LICENSE dist/release/commands/runtime/licenses/LICENSE
          install -m 0444 THIRD_PARTY_NOTICES.md dist/release/commands/runtime/licenses/THIRD_PARTY_NOTICES.md

      - name: Check out approved immutable archive engine source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          repository: memeloop-online/memeloop-token-center
          ref: a65097f952e174ac482abe6ff719966fa9d330cb
          path: .runtime-source
          persist-credentials: false

      - name: Set up locked archive engine Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Cache fixed archive engine build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ".runtime-source -> target"

      - name: Verify locked source and exercise archive engine without production inputs
        working-directory: .runtime-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a65097f952e174ac482abe6ff719966fa9d330cb"
          test "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" = "2134ac15927c1beaceed75d52e48312b6bb93db072c43df4c557cad7de23e029"
          cargo test --locked --lib session_archive_import::tests
          cargo test --locked --test session_archive_import --test session_archive_quarantine --test session_archive_unlinked
          cargo build --locked --release --bin import-cpa-session-archive

      - name: Seal engine binary, compatibility manifest, and retained source
        run: node ops/ci/seal-session-archive-runtime.ts .runtime-source

      - name: Seal the revision-bound release manifest
        run: npm run package:release

      - name: Exercise standalone YAML and PostgreSQL command paths
        run: npm run verify:release -- "$PWD/dist/release"

      - name: Regress protected source staging with only CAP_CHOWN
        env:
          RELEASE_DIRECTORY: ${{ github.workspace }}/dist/release
        run: |
          set -euo pipefail
          command -v setpriv >/dev/null
          command -v capsh >/dev/null
          test "$(cat /proc/sys/fs/protected_hardlinks)" = "1"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          node_binary="$(command -v node)"
          fixture="$(mktemp -d /tmp/migration-tools-stage.XXXXXX)"
          staging_command="$fixture/stage-protected-inputs.mjs"
          cp -- "$RELEASE_DIRECTORY/commands/stage-protected-inputs.mjs" "$staging_command"
          cmp -- "$RELEASE_DIRECTORY/commands/stage-protected-inputs.mjs" "$staging_command"
          cleanup_fixture() { sudo rm -rf -- "$fixture"; }
          trap cleanup_fixture EXIT
          sudo chown 0:0 "$fixture" "$staging_command"
          sudo chmod 0711 "$fixture"
          sudo chmod 0400 "$staging_command"
          sudo env FIXTURE="$fixture" TARGET_UID="$runner_uid" TARGET_GID="$runner_gid" NODE_BINARY="$node_binary" STAGING_COMMAND="$staging_command" \
            setpriv --bounding-set=-all,+chown --inh-caps=-all --ambient-caps=-all --nnp \
            capsh --caps=cap_chown+ep -- -c '
              set -euo pipefail
              test "$(grep ^CapBnd: /proc/self/status | awk "{print \$2}")" = "0000000000000001"
              test "$(grep ^CapPrm: /proc/self/status | awk "{print \$2}")" = "0000000000000001"
              test "$(grep ^CapEff: /proc/self/status | awk "{print \$2}")" = "0000000000000001"
              test "$(grep ^CapInh: /proc/self/status | awk "{print \$2}")" = "0000000000000000"
              test "$(grep ^CapAmb: /proc/self/status | awk "{print \$2}")" = "0000000000000000"
              test "$(grep ^NoNewPrivs: /proc/self/status | awk "{print \$2}")" = "1"
              test "$(cat /proc/sys/fs/protected_hardlinks)" = "1"
              test -x "$NODE_BINARY"
              umask 077
              mkdir -p "$FIXTURE/source/auth/nested" "$FIXTURE/source/auth/logs" "$FIXTURE/inputs" "$FIXTURE/stage"
              printf "fixture\n" > "$FIXTURE/source/config.yaml"
              printf "{\"provider\":\"fixture\"}\n" > "$FIXTURE/source/auth/account.json"
              printf "{\"nested\":true}\n" > "$FIXTURE/source/auth/nested/account.json"
              printf "reviewed non-credential output\n" > "$FIXTURE/source/auth/logs/debug.log"
              printf "{\"version\":1,\"policies\":[],\"usage\":{}}\n" > "$FIXTURE/source/auth/cpa-key-access-policy-state.json"
              printf "fixture-identity\n" > "$FIXTURE/inputs/source-identity.key"
              chmod 0600 "$FIXTURE/source/config.yaml" "$FIXTURE/source/auth/account.json" "$FIXTURE/source/auth/nested/account.json" "$FIXTURE/source/auth/logs/debug.log" "$FIXTURE/source/auth/cpa-key-access-policy-state.json" "$FIXTURE/inputs/source-identity.key"
              "$NODE_BINARY" "$STAGING_COMMAND" \
                --target-uid "$TARGET_UID" --target-gid "$TARGET_GID" \
                --copy "$FIXTURE/source/config.yaml" "$FIXTURE/stage/config.yaml" \
                --copy-auth-dir "$FIXTURE/source/auth" "$FIXTURE/stage/auth" \
                --exclude-auth-subdir logs \
                --copy "$FIXTURE/source/auth/cpa-key-access-policy-state.json" "$FIXTURE/stage/native-key-policy.json" \
                --copy "$FIXTURE/inputs/source-identity.key" "$FIXTURE/stage/source-identity.key"
              chown "$TARGET_UID:$TARGET_GID" "$FIXTURE/stage"
              test "$(stat -c %a "$FIXTURE/stage")" = "700"
              test "$(stat -c %u:%g "$FIXTURE/stage")" = "$TARGET_UID:$TARGET_GID"
            '
          sudo env -i FIXTURE="$fixture" TARGET_UID="$runner_uid" TARGET_GID="$runner_gid" PATH="$PATH" \
            setpriv --reuid="$runner_uid" --regid="$runner_gid" --clear-groups \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all --nnp \
            "$node_binary" --input-type=module -e '
              import { lstatSync, readFileSync } from "node:fs";
              const status = readFileSync("/proc/self/status", "utf8");
              const value = (name) => status.match(new RegExp(`^${name}:\\s*(\\S+)$`, "m"))?.[1];
              if (process.geteuid() === 0 || value("CapBnd") !== "0000000000000000" || value("CapPrm") !== "0000000000000000" || value("CapEff") !== "0000000000000000" || value("CapInh") !== "0000000000000000" || value("CapAmb") !== "0000000000000000" || value("NoNewPrivs") !== "1") throw new Error("consumer privileges are not fully dropped");
              const root = `${process.env.FIXTURE}/stage`;
              for (const file of ["config.yaml", "auth/account.json", "auth/nested/account.json", "auth/cpa-key-access-policy-state.json", "native-key-policy.json", "source-identity.key"]) {
                const stat = lstatSync(`${root}/${file}`);
                if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || (stat.mode & 0o777) !== 0o600 || stat.uid !== Number(process.env.TARGET_UID) || stat.gid !== Number(process.env.TARGET_GID) || stat.size === 0) throw new Error("staged file boundary failed");
              }
              for (const directory of [root, `${root}/auth`, `${root}/auth/nested`]) {
                const stat = lstatSync(directory);
                if (!stat.isDirectory() || stat.isSymbolicLink() || (stat.mode & 0o777) !== 0o700 || stat.uid !== Number(process.env.TARGET_UID) || stat.gid !== Number(process.env.TARGET_GID)) throw new Error("staged directory boundary failed");
              }
              if (lstatSync(`${root}/auth/logs`, { throwIfNoEntry: false }) !== undefined) throw new Error("excluded auth directory was staged");
            '

      - name: Create deterministic release archive and checksums
        env:
          EXPECTED_BACKUP_SHA256: ${{ needs.build-session-archive-backup.outputs.binary_sha256 }}
          RELEASE_ASSETS: ${{ runner.temp }}/migration-tools-release-assets
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ASSETS"
          archive="memeloop-token-center-migration-tools-${GITHUB_SHA}.tar.gz"
          manifest="memeloop-token-center-migration-tools-${GITHUB_SHA}.manifest.json"
          cp dist/release/release-manifest.json "$RELEASE_ASSETS/$manifest"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C dist/release -cf - commands release-manifest.json | gzip -n > "$RELEASE_ASSETS/$archive"
          extracted="$(mktemp -d "$RUNNER_TEMP/migration-tools-release-check.XXXXXX")"
          trap 'rm -rf -- "$extracted"' EXIT
          tar -xzf "$RELEASE_ASSETS/$archive" -C "$extracted" --no-same-owner
          backup="$extracted/commands/runtime/cpa-session-archive-backup"
          test -f "$backup"
          test ! -L "$backup"
          test -x "$backup"
          test "$(sha256sum "$backup" | cut -d ' ' -f 1)" = "$EXPECTED_BACKUP_SHA256"
          "$backup" --help | grep -- 'pages-per-step'
          (
            cd "$RELEASE_ASSETS"
            sha256sum "$archive" "$manifest" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload immutable Release evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: migration-tools-release-${{ github.sha }}
          path: ${{ runner.temp }}/migration-tools-release-assets
          if-no-files-found: error
          retention-days: 90

      - name: Publish or verify the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSETS: ${{ runner.temp }}/migration-tools-release-assets
        run: |
          set -euo pipefail
          tag="migration-tools-${GITHUB_SHA}"
          archive="memeloop-token-center-migration-tools-${GITHUB_SHA}.tar.gz"
          manifest="memeloop-token-center-migration-tools-${GITHUB_SHA}.manifest.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            existing="$(mktemp -d "$RUNNER_TEMP/migration-tools-existing-release.XXXXXX")"
            trap 'rm -rf -- "$existing"' EXIT
            gh release download "$tag" --dir "$existing"
            test "$(find "$existing" -maxdepth 1 -type f | wc -l)" = "3"
            test -f "$existing/$archive"
            test -f "$existing/$manifest"
            test -f "$existing/SHA256SUMS"
            (cd "$existing" && sha256sum -c SHA256SUMS)
            cmp "$RELEASE_ASSETS/SHA256SUMS" "$existing/SHA256SUMS"
            cmp "$RELEASE_ASSETS/$manifest" "$existing/$manifest"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Migration tools $GITHUB_SHA" --notes "Dependency-bundled Node.js 24.18.0 migration command release for $GITHUB_SHA." \
              "$RELEASE_ASSETS/$archive" "$RELEASE_ASSETS/$manifest" "$RELEASE_ASSETS/SHA256SUMS"
          fi


  publish-session-archive-backup:
    name: Publish immutable SQLite backup runtime
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: [verify, build-session-archive-backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified SQLite backup runtime
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: session-archive-backup-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/session-archive-backup-runtime

      - name: Install the shared SQLite backup runtime
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/session-archive-backup-runtime
          EXPECTED_BINARY_SHA256: ${{ needs.build-session-archive-backup.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          test "$(find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 2
          test -f "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz"
          test ! -L "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz"
          test -f "$ARTIFACT_DIRECTORY/SHA256SUMS"
          test ! -L "$ARTIFACT_DIRECTORY/SHA256SUMS"
          (cd "$ARTIFACT_DIRECTORY" && sha256sum -c SHA256SUMS)
          test "$(tar -tzf "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz")" = "cpa-session-archive-backup"
          extracted="$(mktemp -d "$RUNNER_TEMP/session-archive-backup-image.XXXXXX")"
          trap 'rm -rf -- "$extracted"' EXIT
          tar -xzf "$ARTIFACT_DIRECTORY/session-archive-backup-runtime.tar.gz" -C "$extracted" --no-same-owner
          binary="$extracted/cpa-session-archive-backup"
          test -f "$binary"
          test ! -L "$binary"
          test -x "$binary"
          test "$(sha256sum "$binary" | cut -d ' ' -f 1)" = "$EXPECTED_BINARY_SHA256"
          file "$binary" | grep -- 'statically linked'
          ! readelf -l "$binary" | grep -q 'Requesting program interpreter'
          "$binary" --help | grep -- 'pages-per-step'
          mkdir -p dist/release/commands/runtime
          install -m 0555 "$binary" dist/release/commands/runtime/cpa-session-archive-backup
          packaged="dist/release/commands/runtime/cpa-session-archive-backup"
          test -f "$packaged"
          test ! -L "$packaged"
          test -x "$packaged"
          test "$(sha256sum "$packaged" | cut -d ' ' -f 1)" = "$EXPECTED_BINARY_SHA256"
          "$packaged" --help | grep -- 'pages-per-step'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish digest-addressable SQLite backup image
        id: publish-backup
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: ops/ci/Dockerfile.session-archive-backup
          build-args: RELEASE_REVISION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:session-archive-backup-${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Record immutable SQLite backup image identity
        run: |
          set -euo pipefail
          [[ "${{ steps.publish-backup.outputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'SQLite backup OCI image: `ghcr.io/%s@%s`\n' "$GITHUB_REPOSITORY" "${{ steps.publish-backup.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
