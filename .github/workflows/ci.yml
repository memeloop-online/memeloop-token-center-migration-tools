name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify migration tools
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm ci --ignore-scripts --no-audit

      - name: Verify repository policy, types, and tests
        run: npm run verify

  publish-ghcr:
    name: Publish immutable migration-tools image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/memeloop-token-center-migration-tools
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to private GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the git-SHA image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.importer
          platforms: linux/amd64
          outputs: type=image,push=true,oci-mediatypes=true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Run digest-pinned extensionless entrypoint self-check
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          test "${DIGEST#sha256:}" != "$DIGEST"
          for entrypoint in \
            /usr/local/bin/export-cpa-source-route-inventory \
            /usr/local/bin/export-cpa-target-route-receipt \
            /usr/local/bin/import-cpa-model-routes \
            /usr/local/bin/import-cpa-key-policy \
            /usr/local/bin/generate-provider-exact-policy-inputs \
            /usr/local/bin/import-cpa-upstreams \
            /usr/local/bin/reconcile-final-price-cache \
            /usr/local/bin/stage-protected-inputs \
            /usr/local/bin/export-cpa-session-archive-delta; do
            docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=8m \
              --security-opt no-new-privileges --cap-drop ALL \
              "$IMAGE@$DIGEST" "$entrypoint" --help
          done

      - name: Regress full protected source staging with root CHOWN only
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          test "${DIGEST#sha256:}" != "$DIGEST"
          fixture_volume="migration-tools-stage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_fixture_volume() {
            docker volume rm -f "$fixture_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_fixture_volume EXIT
          docker volume create "$fixture_volume" >/dev/null
          docker run --rm --network none --read-only --mount type=volume,src="$fixture_volume",dst=/work \
            --user 0:0 --security-opt no-new-privileges --cap-drop ALL --cap-add CHOWN \
            --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
              test "$(cat /proc/sys/fs/protected_hardlinks)" = "1"
              test "$(grep ^CapEff: /proc/self/status | cut -f2)" = "0000000000000001"
              umask 077
              mkdir -p /work/source/auth/nested /work/source/auth/logs /work/inputs /work/stage
              printf "fixture\n" > /work/source/config.yaml
              printf "{\"provider\":\"fixture\"}\n" > /work/source/auth/account.json
              printf "{\"nested\":true}\n" > /work/source/auth/nested/account.json
              printf "reviewed non-credential output\n" > /work/source/auth/logs/debug.log
              printf "{\"version\":1,\"policies\":[],\"usage\":{}}\n" > /work/source/auth/cpa-key-access-policy-state.json
              printf "fixture-identity\n" > /work/inputs/source-identity.key
              chmod 0600 /work/source/config.yaml /work/source/auth/account.json /work/source/auth/nested/account.json /work/source/auth/logs/debug.log /work/source/auth/cpa-key-access-policy-state.json /work/inputs/source-identity.key
              /usr/local/bin/stage-protected-inputs \
                --copy /work/source/config.yaml /work/stage/config.yaml \
                --copy-auth-dir /work/source/auth /work/stage/auth \
                --exclude-auth-subdir logs \
                --copy /work/source/auth/cpa-key-access-policy-state.json /work/stage/native-key-policy.json \
                --copy /work/inputs/source-identity.key /work/stage/source-identity.key
              chown 10001:10001 /work/stage
              test "$(stat -c %a /work/stage)" = "700"
              test "$(stat -c %u:%g /work/stage)" = "10001:10001"
            '
          docker run --rm --network none --read-only --mount type=volume,src="$fixture_volume",dst=/work,readonly \
            --user 10001:10001 --security-opt no-new-privileges --cap-drop ALL \
            --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
              test "$(grep ^CapEff: /proc/self/status | cut -f2)" = "0000000000000000"
              for file in /work/stage/config.yaml /work/stage/auth/account.json /work/stage/auth/nested/account.json /work/stage/auth/cpa-key-access-policy-state.json /work/stage/native-key-policy.json /work/stage/source-identity.key; do
                test -r "$file"
                test "$(wc -c < "$file")" -gt 0
                test "$(stat -c %a "$file")" = "600"
                test "$(stat -c %u:%g "$file")" = "10001:10001"
                test "$(stat -c %h "$file")" = "1"
              done
              for directory in /work/stage /work/stage/auth /work/stage/auth/nested; do
                test "$(stat -c %a "$directory")" = "700"
                test "$(stat -c %u:%g "$directory")" = "10001:10001"
              done
              test ! -e /work/stage/auth/logs
            '

      - name: Emit the immutable digest and manifest
        id: evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          test "${DIGEST#sha256:}" != "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee "$RUNNER_TEMP/migration-tools-manifest.txt"
          {
            echo "### Immutable migration-tools image"
            echo
            printf -- '- image: `%s:sha-%s`\n' "$IMAGE" "$GITHUB_SHA"
            printf -- '- digest: `%s`\n' "$DIGEST"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/migration-tools-manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "image=$IMAGE"
            echo "digest=$DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable manifest evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.2
        with:
          name: migration-tools-image-${{ github.sha }}
          path: ${{ runner.temp }}/migration-tools-manifest.txt
          if-no-files-found: error
          retention-days: 90
