name: Package visibility

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    name: Make migration-tools package public
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set the linked container package to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: >-
          gh api --method PATCH
          "/orgs/${PACKAGE_OWNER}/packages/container/memeloop-token-center-migration-tools"
          -f visibility=public
