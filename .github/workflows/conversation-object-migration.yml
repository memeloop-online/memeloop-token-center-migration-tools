name: Conversation object migration

on:
  pull_request:
    paths:
      - ops/object-migration-runtime/**
      - .github/workflows/conversation-object-migration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: conversation_objects_test
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture -d conversation_objects_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: memeloop-online/memeloop-token-center
          ref: 67d1d77ad4e021cdd5b59354ee8346ddd665627a
          path: .object-runtime
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .object-runtime
      - name: Assemble independently owned migration command
        run: |
          cp ops/object-migration-runtime/migrate-conversation-objects.rs .object-runtime/src/bin/
          mkdir -p .object-runtime/src/bin/conversation-object-tests
          cp ops/object-migration-runtime/conversation_object_migration_tests.rs .object-runtime/src/bin/conversation-object-tests/
          sed -i 's|path = "conversation_object_migration_tests.rs"|path = "conversation-object-tests/conversation_object_migration_tests.rs"|' .object-runtime/src/bin/migrate-conversation-objects.rs
      - name: Test exact byte transfer, resume, reconstruction and source retention
        working-directory: .object-runtime
        env:
          MTC_TEST_POSTGRES_URL: postgres://fixture:fixture@127.0.0.1:5432/conversation_objects_test
        run: cargo test --locked --bin migrate-conversation-objects
      - name: Build reviewed migration command
        working-directory: .object-runtime
        run: cargo build --locked --bin migrate-conversation-objects
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: conversation-object-migration-${{ github.sha }}
          path: .object-runtime/target/debug/migrate-conversation-objects
          retention-days: 7
